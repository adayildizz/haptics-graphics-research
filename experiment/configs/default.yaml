# Example ExperimentConfig for one base-height x width configuration.
# Any field not listed here falls back to the dataclass default in config.py.
# The supervisor should copy this file per configuration rather than edit
# code -- changing any value here changes the experiment with zero code edits.

base_height_mm: 10.0
bar_width_mm: 10.0
inter_bar_gap_mm: 40.0

delta_max_pct: 0.30
n_levels: 7                      # odd -> the 0% midpoint is dropped: +-10/20/30%, six real levels
include_zero_level: false
trials_per_level: 10
sweeps_per_block: 1              # levels per block = n_levels * this; 1 -> blocks of 6
catch_trial_pct: 0.10

feedback: false
n_practice_trials: 16
practice_easiest_levels: 2       # practice uses the 2 largest |level| magnitudes, both signs: +-20% and +-30%
break_every_n_trials: 0          # 0 = the main block runs without break screens
response_timeout_s: 30.0         # response time limit, practice trials included
max_trial_attempts: 3            # incl. the first showing; caps the timeout-retry loop
practice_voice_feedback: true
practice_spoken_feedback: true   # spoken Correct/Incorrect in practice (participant is blindfolded)
practice_pass_fraction: 0.75     # 16 trials -> at least 12 correct, otherwise practice repeats
ideal_finger_speed_mm_s: 100.0  # 10 cm/s
ideal_speed_tolerance_pct: 0.30 # accepted band: 70-130 mm/s
record_main_trace: true          # records practice attempts too (tagged is_practice)

masking_noise: true              # continuous brown noise in the headphones for the whole session
masking_noise_volume: 0.30

render_mode: predictive          # predictive | position | timed_legacy (README: Rendering Method)
predict_window_samples: 3        # samples in the velocity regression
predict_horizon_factor: 1.5      # prediction horizon = this x the measured median sample interval ...
predict_horizon_max_ms: 25.0     # ... but never more than this
predict_min_speed_mm_s: 5.0      # slower than this: no prediction, the sample itself decides
latency_compensation_ms: 0.0     # leave at 0 until the rig's latency has been measured
signal_watchdog_ms: 100.0        # no plan from the main loop for this long -> signal off
ir_filter: true                  # ignore the IR frame's short false lifts and jumps (README: Rendering Method)
ir_lift_debounce_ms: 100.0       # a lift counts only once it has lasted this long
ir_jump_mm: 20.0                 # a report this far from the last accepted position is rejected ...
ir_jump_reanchor_ms: 1000.0      # ... until it comes back within that distance, or for this long at most

carrier_freq_hz: 125.0
voltage_peak: 4.0
ir_sample_hz_nominal: 100.0

rng_seed: null
participant_id: ""
dominant_hand: ""               # "left" | "right": the exploring hand; arrow keys go under the other one
mode: constant_stimuli
